    <!-- Mobile Joystick Overlay -->
    <style>
        /* Safely hide original game's touch controls without breaking the HTML/Body tags */
        body > div[class*="touch"], 
        body > div[class*="joystick"]:not(.mobile-joystick-zone), 
        body > div[class*="controls"]:not(.env-controls) {
            display: none !important;
        }

        .mobile-joystick-zone {
            display: none;
            position: fixed;
            bottom: 40px;
            left: 40px;
            width: 140px;
            height: 140px;
            z-index: 9999;
            touch-action: none;
        }
        @media (max-width: 768px) {
            .mobile-joystick-zone { display: block; }
        }
        .joystick-base {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
        .joystick-thumb {
            position: absolute;
            top: 50%; left: 50%;
            width: 60px; height: 60px;
            margin-top: -30px; margin-left: -30px;
            transition: transform 0.05s linear;
        }
        .joystick-base circle {
            fill: #ffffff;
            fill-opacity: 0.15;
            stroke: #ffffff;
            stroke-opacity: 0.3;
            stroke-width: 2;
        }
        .joystick-thumb circle {
            fill: #ffffff;
            fill-opacity: 0.5;
        }
    </style>

    <div class="mobile-joystick-zone" id="joystickZone">
        <svg class="joystick-base" viewBox="0 0 160 160">
            <circle cx="80" cy="80" r="70" />
        </svg>
        <svg class="joystick-thumb" id="joystickThumb" viewBox="0 0 60 60">
            <circle cx="30" cy="30" r="28" />
        </svg>
    </div>

    <script>
        // Joystick Logic
        const zone = document.getElementById('joystickZone');
        const thumb = document.getElementById('joystickThumb');
        let activeKeys = {};

        function triggerKey(key, keyCode, type) {
            if (type === 'keydown' && !activeKeys[key]) {
                activeKeys[key] = true;
                const ev = new KeyboardEvent('keydown', { key: key, code: 'Key' + key.toUpperCase(), keyCode: keyCode, which: keyCode, bubbles: true });
                window.dispatchEvent(ev);
                document.dispatchEvent(ev);
            } else if (type === 'keyup' && activeKeys[key]) {
                activeKeys[key] = false;
                const ev = new KeyboardEvent('keyup', { key: key, code: 'Key' + key.toUpperCase(), keyCode: keyCode, which: keyCode, bubbles: true });
                window.dispatchEvent(ev);
                document.dispatchEvent(ev);
            }
        }
        
        function triggerArrow(key, type) {
            const ev = new KeyboardEvent(type, { key: key, code: key, bubbles: true });
            window.dispatchEvent(ev);
            document.dispatchEvent(ev);
        }

        let isDragging = false;
        let centerX, centerY;

        zone.addEventListener('touchstart', (e) => {
            isDragging = true;
            const rect = zone.getBoundingClientRect();
            centerX = rect.left + rect.width / 2;
            centerY = rect.top + rect.height / 2;
            handleTouch(e.touches[0]);
        }, { passive: false });

        zone.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            handleTouch(e.touches[0]);
        }, { passive: false });

        const endDrag = () => {
            isDragging = false;
            thumb.style.transform = `translate(0px, 0px)`;
            
            triggerKey('w', 87, 'keyup');
            triggerKey('s', 83, 'keyup');
            triggerKey('a', 65, 'keyup');
            triggerKey('d', 68, 'keyup');
            
            triggerArrow('ArrowUp', 'keyup');
            triggerArrow('ArrowDown', 'keyup');
            triggerArrow('ArrowLeft', 'keyup');
            triggerArrow('ArrowRight', 'keyup');
        };
        zone.addEventListener('touchend', endDrag);
        zone.addEventListener('touchcancel', endDrag);

        function handleTouch(touch) {
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const maxDist = 50;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }
            
            thumb.style.transform = `translate(${dx}px, ${dy}px)`;
            
            const threshold = 15;
            
            if (dy < -threshold) { triggerKey('w', 87, 'keydown'); triggerArrow('ArrowUp', 'keydown'); }
            else { triggerKey('w', 87, 'keyup'); triggerArrow('ArrowUp', 'keyup'); }
            
            if (dy > threshold) { triggerKey('s', 83, 'keydown'); triggerArrow('ArrowDown', 'keydown'); }
            else { triggerKey('s', 83, 'keyup'); triggerArrow('ArrowDown', 'keyup'); }
            
            if (dx < -threshold) { triggerKey('a', 65, 'keydown'); triggerArrow('ArrowLeft', 'keydown'); }
            else { triggerKey('a', 65, 'keyup'); triggerArrow('ArrowLeft', 'keyup'); }
            
            if (dx > threshold) { triggerKey('d', 68, 'keydown'); triggerArrow('ArrowRight', 'keydown'); }
            else { triggerKey('d', 68, 'keyup'); triggerArrow('ArrowRight', 'keyup'); }
        }
    </script>
